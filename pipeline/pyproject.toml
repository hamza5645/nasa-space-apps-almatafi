[project]
name = "almatafi-pipeline"
version = "0.1.0"
description = "Ingest, grid and harmonize MODIS and VIIRS FIRMS hotspots"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=2.0",
]

[project.optional-dependencies]
# Validation charts (almatafi.harmonize.validate.plots); skipped when not installed.
plots = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["almatafi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
